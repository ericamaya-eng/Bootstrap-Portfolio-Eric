<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Code as Art | My Art Portfolio</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(135deg, #301934 60%, #a259f7 100%);
      color: #ede9f9;
      min-height: 100vh;
      font-family: 'Segoe UI', Arial, sans-serif;
    }
    .navbar {
      background: #000 !important;
      box-shadow: 0 2px 8px rgba(48,25,52,0.4);
    }
    .navbar-brand,
    .navbar-nav .nav-link {
      color: #d1b3ff !important;
      font-weight: 600;
      letter-spacing: 1.5px;
    }

    .logo-image { height: 64px; width: auto; border-radius: 8px; margin-right: 8px; }

    .container-art { margin-top: 2.7rem; margin-bottom: 2.4rem; }

    .artwork-thumb {
      display: block;
      background: #22112b;
      border-radius: 18px;
      box-shadow: 0 2px 14px rgba(160,89,247,0.13);
      overflow: hidden;
      margin: 0 auto;
      aspect-ratio: 1 / 1;
      width: 100%;
      max-width: 720px;
      border: 2px solid transparent;
    }
    .artwork-img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      background: #22112b;
      padding: 0.7rem;
    }

    .project-title {
      color: #d1b3ff;
      font-weight: 700;
      font-size: 1.25rem;
      text-align: center;
      margin: 1rem 0 0.6rem 0;
      text-transform: capitalize;
    }
    .project-description {
      color: #efe9fb;
      background: rgba(34,17,43,0.18);
      border-radius: 12px;
      padding: 1.1rem 1.2rem;
      max-width: 720px;
      margin: 1rem auto 3rem auto;
      line-height: 1.6;
      font-size: 1rem;
      box-shadow: 0 1px 10px rgba(0,0,0,0.25);
      text-align: left;
    }

    @media (max-width: 767.98px) {
      .logo-image { height: 44px; }
      .project-title { font-size: 1.05rem; }
      .project-description { padding: 0.9rem; font-size: 0.96rem; }
    }
  </style>
</head>
<body>
  <nav class="navbar navbar-expand-lg">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center" href="index.html">
        <img src="logo.png" alt="Portfolio Logo" class="logo-image">
        <span>Portfolio</span>
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
              data-bs-target="#mainNavbar" aria-controls="mainNavbar"
              aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon" style="filter: invert(1);"></span>
      </button>
      <div class="collapse navbar-collapse justify-content-end" id="mainNavbar">
        <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
          <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="container container-art">
    <div class="row justify-content-center">
      <div class="col-12 text-center">
        <div class="project-title">Code as Art</div>
      </div>

      <div class="col-12">
        <a class="artwork-thumb" href="Screenshot%202025-11-26%20094609.png" target="_blank" rel="noopener noreferrer">
          <img src="Screenshot%202025-11-26%20094609.png" alt="Code as Art screenshot" class="artwork-img">
        </a>
      </div>

      <div class="col-12">
        <div class="project-description">
          <p><a href="https://ericamaya-eng.github.io/LA-Suburbs/" target="_blank" rel="noopener noreferrer">https://ericamaya-eng.github.io/LA-Suburbs/</a> Links to an external site.</p>
          <p>I made a simplistic interactive page where you go around a suburb at the outskirts of a city. My inspiration was growing up in a suburb of LA County.</p>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
